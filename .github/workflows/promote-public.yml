name: Promote to public repository

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-public
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check public repository credential
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "::error::Set the PUBLIC_REPO_TOKEN repository secret before promoting."
            exit 1
          fi

      - name: Check out the selected development revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: development
          persist-credentials: false

      - name: Check out the public default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Vectorworks/developer-ai
          ref: main
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public

      - name: Create public snapshot and pull request
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d "$RUNNER_TEMP/public-snapshot.XXXXXX")"
          git -C development checkout-index --all --prefix="$snapshot/"
          rsync -a --delete --exclude='/.git/' "$snapshot/" public/
          cd public
          git add -A --force
          if git diff --cached --quiet; then
            echo "The public repository already matches the selected snapshot."
            exit 0
          fi

          branch="promote/snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Promote development snapshot"
          git push origin "$branch"
          gh pr create --repo Vectorworks/developer-ai --base main --head "$branch" \
            --title "Promote development snapshot" \
            --body "Review this snapshot before merging. The promotion mirrors all tracked files and removes public-only files."
